name: NO Image

on:
  push:
    branches:
      - main

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          echo "Removing large, unnecessary preinstalled packages..."
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /usr/lib/jvm
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "Cleanup complete."

      - name: Show disk usage after cleanup
        run: df -h /

  build:
    runs-on: ubuntu-latest
    needs: cleanup
    env:
      DOWNLOADS_UPLOAD_TOKEN: ${{ secrets.DOWNLOADS_UPLOAD_TOKEN }}
      PRIV_KEY_SIGNING: ${{ secrets.PRIV_KEY_SIGNING }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sudo wget git podman python3-git python3-yaml python3-jsonschema \
            python3-distro python3-kconfiglib python3-pip libssl-dev locales \
            chrpath diffstat lz4 binutils build-essential bzip2 cpio file g++ \
            gawk gcc liblz4-tool zstd unzip dnf
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          # Set locale
          sudo locale-gen en_US.UTF-8
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US:en
          export LC_ALL=en_US.UTF-8
          # Install Python packages
          pip install --no-cache-dir python-gnupg
          # Copy any local files you need (if they exist in repo)
          cp $GITHUB_WORKSPACE/docker/yoctobuilder/STMicroelectronics.zip /usr/local/bin/

      - name: Make build script executable
        run: chmod +x $GITHUB_WORKSPACE/scripts/build.sh

      - name: Run build
        run: |
          $GITHUB_WORKSPACE/scripts/build.sh \
            --kasfile=kas-prod \
            --priv-key=${PRIV_KEY_SIGNING} \
            --repo-slug=${{ github.repository }} \
            --build-number=${{ github.run_number }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/sm*
